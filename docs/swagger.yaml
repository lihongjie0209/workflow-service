info:
  contact: {}
  description: 'Workflow definitions, durable instances, and approval tasks. Error
    code ranges: 0 success; 10000-19999 common/input; 20000-29999 authentication/authorization;
    30000-39999 business/concurrency; 50000-59999 infrastructure.'
  title: Workflow Service API
  version: 0.1.0
paths:
  /api/v1/me:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httptransport.Response'
            - properties:
                body:
                  $ref: '#/definitions/httptransport.MeResponseBody'
              type: object
        "401":
          description: 'Code 20001: unauthorized'
          schema:
            $ref: '#/definitions/httptransport.Response'
      security:
      - Bearer: []
      summary: Return the authenticated subject
      tags:
      - authentication
  /api/v1/version:
