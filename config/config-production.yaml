# Production deliberately fails fast until secrets, endpoints, and TLS files
# are injected through APP_* variables or the platform secret manager.
app:
  env: production
http:
  address: 0.0.0.0:8080
log:
  level: info
  format: json
swagger:
  enabled: false
  require_auth: true
grpc:
  address: 0.0.0.0:9090
  reflection_enabled: false
  tls:
    enabled: true
    cert_file: ""
    key_file: ""
auth:
  jwks_url: ""
  issuer: identity-service
  audience: workflow-service
database:
  enabled: true
  name: platform
  schema: workflow
  dsn: ""
redis:
  enabled: true
migration:
  auto_up: true
  create_schema: false
  database_url: ""
rate_limit:
  enabled: true
idempotency:
  enabled: true
  http_paths:
    - /api/v1/workflow/definitions/create
    - /api/v1/workflow/definitions/update
    - /api/v1/workflow/definitions/publish
    - /api/v1/workflow/definitions/disable
    - /api/v1/workflow/instances/start
    - /api/v1/workflow/instances/cancel
    - /api/v1/workflow/tasks/claim
    - /api/v1/workflow/tasks/complete
    - /api/v1/workflow/tasks/delegate
  grpc_methods:
    - /platform.workflow.v1.WorkflowService/CreateDefinition
    - /platform.workflow.v1.WorkflowService/UpdateDefinition
    - /platform.workflow.v1.WorkflowService/PublishDefinition
    - /platform.workflow.v1.WorkflowService/DisableDefinition
    - /platform.workflow.v1.WorkflowService/StartInstance
    - /platform.workflow.v1.WorkflowService/CancelInstance
    - /platform.workflow.v1.WorkflowService/ClaimTask
    - /platform.workflow.v1.WorkflowService/CompleteTask
    - /platform.workflow.v1.WorkflowService/DelegateTask
observability:
  metrics_enabled: true
  tracing_enabled: false
authorization:
  enabled: true
event_bus:
  enabled: true
temporal:
  enabled: true
  host_port: ""
  namespace: default
  task_queue: workflow-service
outbound:
  grpc:
    authorization:
      target: dns:///authorization-service.platform.svc.cluster.local:9090
      timeout: 5s
      retry:
        max_attempts: 3
        initial_backoff: 100ms
        max_backoff: 1s
        methods: [/platform.authorization.v1.AuthorizationService/Check, /platform.authorization.v1.AuthorizationService/ListBindings]
      breaker:
        enabled: true
        failure_threshold: 5
        open_timeout: 30s
      tls:
        enabled: true
        server_name: authorization-service
        ca_file: /etc/workflow-service/tls/ca.crt
    application:
      target: dns:///application-service.platform.svc.cluster.local:9090
      timeout: 5s
      auth: {type: psk, token: ""}
      retry:
        max_attempts: 3
        initial_backoff: 100ms
        max_backoff: 1s
        methods: [/platform.application.v1.ApplicationService/BatchCheckTenantApplications]
      breaker:
        enabled: true
        failure_threshold: 5
        open_timeout: 30s
      tls:
        enabled: true
        server_name: application-service
        ca_file: /etc/workflow-service/tls/ca.crt
